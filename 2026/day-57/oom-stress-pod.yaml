apiVersion: v1
kind: Pod
metadata:
  name: oom-stress-pod
  labels:
    app: memory-stress
spec:
  containers:
  - name: stress-container
    image: polinux/stress:latest
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]
    resources:
      limits:
        memory: 100Mi
      requests:
        memory: 50Mi
