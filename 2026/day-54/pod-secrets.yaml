apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "echo \"DB_USER env var: $DB_USER\" && echo \"Files in /etc/db-credentials:\" && ls -la /etc/db-credentials && echo \"DB_PASSWORD file content:\" && cat /etc/db-credentials/DB_PASSWORD && sleep 3600"]
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: DB_USER
    volumeMounts:
    - name: db-creds-vol
      mountPath: /etc/db-credentials
      readOnly: true
  volumes:
  - name: db-creds-vol
    secret:
      secretName: db-credentials
