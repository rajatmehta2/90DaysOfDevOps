apiVersion: v1
kind: Pod
metadata:
  name: nginx-volume-pod
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: nginx-config-vol
      mountPath: /etc/nginx/conf.d
  volumes:
  - name: nginx-config-vol
    configMap:
      name: nginx-config
