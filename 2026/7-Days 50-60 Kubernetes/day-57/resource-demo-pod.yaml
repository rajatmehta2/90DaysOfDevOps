apiVersion: v1
kind: Pod
metadata:
  name: resource-demo-pod
  labels:
    app: resource-demo
spec:
  containers:
  - name: web-container
    image: nginx:1.25.4-alpine
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    ports:
    - containerPort: 80
